server:
  port: 8080

spring:
  application:
    name: rbac-authorization-engine

  datasource:
    url: jdbc:h2:mem:rbacdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update       # Hibernate creates/updates the schema (roles, permissions, mappings) in H2
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  cache:
    type: simple            # In-memory ConcurrentMapCache used to cache resolved user permissions

logging:
  level:
    root: INFO
    com.techpulse.rbac: DEBUG
    org.springframework.security: INFO

# Default admin credentials created at startup by DataSeeder (see README "Seed Data")
rbac:
  seed:
    enabled: true
